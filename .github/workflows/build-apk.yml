name: Build DJALIMEN Manager APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DJALIMEN MANAGER
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install required Android SDK packages
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Configure CI debug signing
        working-directory: upstream
        run: |
          # The upstream signing keystore is private; use the standard debug keystore in CI.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("manager/build.gradle.kts")
          s = p.read_text()
          old = '        signingConfig = signingConfigs.getByName("frb-project")'
          if old not in s:
              raise SystemExit("Expected upstream debug signing config was not found")
          p.write_text(s.replace(old, '        // CI: use standard Android debug signing config', 1))
          PY

      - name: Apply DJALIMEN app branding
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Rebrand user-facing native libaxeron.so diagnostics at source level.
          # Keep protocol identifiers (AXERON env vars, axeron_server, JNI/class paths,
          # executable name and library path) unchanged because scripts/services depend on them.
          native_starter = Path("server/src/main/cpp/starter.cpp")
          native_source = native_starter.read_text(encoding="utf-8")
          native_replacements = {
              'printf("info: axeron_server pid is %d\\n", pid);': 'printf("info: DJALIMEN native service pid is %d\\n", pid);',
              'printf("info: axeron_starter exit with 0\\n");': 'printf("info: DJALIMEN native starter exit with 0\\n");',
              'fatal: run AxManager from non root nor adb user (uid=%d).\\n': 'fatal: run DJALIMEN MANAGER from non root nor adb user (uid=%d).\\n',
              'fatal: can\'t kill %d, please try to stop existing AxManager from app first.\\n': 'fatal: can\'t kill %d, please stop the existing DJALIMEN MANAGER service from the app first.\\n',
          }
          for old, new in native_replacements.items():
              if old not in native_source:
                  raise SystemExit("Native branding target missing: " + old)
              native_source = native_source.replace(old, new, 1)
          native_starter.write_text(native_source, encoding="utf-8")
          print("Applied safe DJALIMEN branding to native starter diagnostics; internal ABI/protocol names preserved.")

          # Change only user-facing string resources. Never rename style/theme/resource identifiers.
          res = Path("manager/src/main/res")
          changed = []
          for p in res.glob("values*/strings.xml"):
              s = p.read_text(encoding="utf-8")
              updated = s.replace("AxManager", "DJALIMEN MANAGER")
              # Consistent DJALIMEN naming for help/support labels in English and Indonesian.
              if p.name == "strings.xml":
                  updated = updated.replace('<string name="support_me">Support Me</string>', '<string name="support_me">Support DJALIMEN</string>')
                  updated = updated.replace('<string name="support_me">Dukung Saya</string>', '<string name="support_me">Dukung DJALIMEN</string>')
                  updated = updated.replace('<string name="learn_more">Learn DJALIMEN MANAGER</string>', '<string name="learn_more">Learn DJALIMEN MANAGER</string>')
                  updated = updated.replace('<string name="learn_more">Pelajari DJALIMEN MANAGER</string>', '<string name="learn_more">Pelajari DJALIMEN MANAGER</string>')
              if updated != s:
                  p.write_text(updated, encoding="utf-8")
                  changed.append(str(p))

          strings = res / "values" / "strings.xml"
          s = strings.read_text(encoding="utf-8")
          if '<string name="app_name">DJALIMEN MANAGER</string>' not in s:
              raise SystemExit("Could not verify launcher app_name")

          settings = Path("settings.gradle.kts")
          s = settings.read_text(encoding="utf-8")
          s = re.sub(r'rootProject\.name\s*=\s*"[^"]+"', 'rootProject.name = "DJALIMEN MANAGER"', s, count=1)
          settings.write_text(s, encoding="utf-8")

          gradle = Path("manager/build.gradle.kts")
          s = gradle.read_text(encoding="utf-8")
          s = s.replace('"AxManager_v', '"DJALIMEN-MANAGER_v')
          gradle.write_text(s, encoding="utf-8")

          print("Updated string resources:", *changed, sep="\\n - ")
          print("Verified launcher label: DJALIMEN MANAGER")
          # Rebrand the About / Support surfaces while preserving upstream attribution and behavior.
          settings_ui = Path("manager/src/main/java/frb/axeron/manager/ui/screen/Settings.kt")
          s = settings_ui.read_text(encoding="utf-8")
          replacements = {
              'val githubUrl = "https://github.com/fahrez182"': 'val githubUrl = "https://github.com/rizal070901-dot/DJALIMEN-MANAGER"',
              'val sociabuzzUrl = "https://sociabuzz.com/fahrezone/tribe"': 'val sociabuzzUrl = "https://github.com/rizal070901-dot/DJALIMEN-MANAGER"',
              'text = "fahrez182 (FahrezONE)"': 'text = "DJALIMEN CHANNEL"',
              'text = "“Everything is an Idea”"': 'text = "“Built for performance. Powered by the community.”"',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit("Settings About patch target missing: " + old)
              s = s.replace(old, new, 1)
          credit = '                Text(\n                    text = stringResource(R.string.developer_and_maintainer),'
          if credit not in s:
              raise SystemExit("About attribution insertion point missing")
          s = s.replace(credit, '                Text(\n                    text = "Open-source foundation: AxManager by FahrezRB",\n                    fontSize = 12.sp,\n                    color = MaterialTheme.colorScheme.onSurfaceVariant\n                )\n\n' + credit, 1)
          # Keep the original contributor portrait and show explicit upstream credit below the DJALIMEN title.

          # Rebrand the existing support label only. Keep the upstream button layout and click behavior intact.
          old_support = 'Text(stringResource(R.string.support_or_donate))'
          if old_support not in s:
              raise SystemExit("Upstream support button expression not found")
          s = s.replace(old_support, 'Text("Dukung DJALIMEN di GitHub")', 1)
          settings_ui.write_text(s, encoding="utf-8")
          # Generate a dedicated YouTube vector icon for the About action.
          youtube_icon = Path("manager/src/main/res/drawable/ic_youtube.xml")
          youtube_icon.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M23.5,6.2c-0.3,-1.1 -1.2,-2 -2.3,-2.3C19.2,3.4 12,3.4 12,3.4s-7.2,0 -9.2,0.5C1.7,4.2 0.8,5.1 0.5,6.2 0,8.2 0,12 0,12s0,3.8 0.5,5.8c0.3,1.1 1.2,2 2.3,2.3 2,0.5 9.2,0.5 9.2,0.5s7.2,0 9.2,-0.5c1.1,-0.3 2,-1.2 2.3,-2.3C24,15.8 24,12 24,12s0,-3.8 -0.5,-5.8z"/>
              <path android:fillColor="#FF080F1D" android:pathData="M9.6,15.8L9.6,8.2 16,12z"/>
          </vector>
          """, encoding="utf-8")


          home_ui = Path("manager/src/main/java/frb/axeron/manager/ui/screen/Home.kt")
          s = home_ui.read_text(encoding="utf-8")
          s = s.replace('https://github.com/fahrez182/AxManager/issues', 'https://github.com/rizal070901-dot/DJALIMEN-MANAGER/issues')
          s = s.replace('https://github.com/fahrez182/AxManager', 'https://github.com/rizal070901-dot/DJALIMEN-MANAGER')
          s = s.replace('https://fahrez182.github.io/AxManager', 'https://github.com/rizal070901-dot/DJALIMEN-MANAGER#readme')
          home_ui.write_text(s, encoding="utf-8")

          # DJALIMEN visual identity: vivid blue accent; all resource identifiers remain unchanged.
          colors = res / "values" / "colors.xml"
          s = colors.read_text(encoding="utf-8")
          if '<color name="orange">#D3460E</color>' not in s:
              raise SystemExit("Brand accent color target missing")
          colors.write_text(s.replace('<color name="orange">#D3460E</color>', '<color name="orange">#5577FF</color>', 1), encoding="utf-8")
          
          # Apply a complete DJALIMEN Midnight Blue Material 3 theme.
          color_kt = Path("manager/src/main/java/frb/axeron/manager/ui/theme/Color.kt")
          s = color_kt.read_text(encoding="utf-8")
          s = s.replace('val basePrimaryDefault = Color(0xFFFFB487)', 'val basePrimaryDefault = Color(0xFF4D8DFF)')
          s = s.replace('Color(0xFF101010).blend(black, 0.08f)', 'Color(0xFF0A1020).blend(black, 0.04f)')
          s = s.replace('Color(0xFFFFFFFF).blend(white, 0.02f)', 'Color(0xFFF4F7FF).blend(white, 0.02f)')
          color_kt.write_text(s, encoding="utf-8")

          # Match Android system bars and legacy views to the same navy palette.
          for theme_file in [
              Path("manager/src/main/res/values/themes.xml"),
              Path("manager/src/main/res/values-night/themes.xml"),
          ]:
              s = theme_file.read_text(encoding="utf-8")
              s = s.replace('<item name="colorPrimary">@color/orange</item>', '<item name="colorPrimary">#4D8DFF</item>')
              if '<item name="android:statusBarColor">' not in s:
                  s = s.replace('</style>', chr(10).join(['<item name="android:statusBarColor">#080F1D</item>', '        <item name="android:navigationBarColor">#080F1D</item>', '        <item name="android:windowLightStatusBar">false</item>', '        <item name="android:windowLightNavigationBar">false</item>', '    </style>']), 1)
              theme_file.write_text(s, encoding="utf-8")

          # Completely redesign the About bottom sheet while keeping the original navigation actions.
          settings_ui = Path("manager/src/main/java/frb/axeron/manager/ui/screen/Settings.kt")
          s = settings_ui.read_text(encoding="utf-8")
          start = s.index("fun DeveloperInfo(")
          end = s.index(chr(10) + "private fun isShizukuAppInstalled", start)
          about_ui = """fun DeveloperInfo(
              showDialog: Boolean,
              onDismissRequest: () -> Unit
          ) {
              val uriHandler = LocalUriHandler.current
              val githubUrl = "https://github.com/rizal070901-dot/DJALIMEN-MANAGER"
              val youtubeUrl = "https://youtube.com/@djalimenchannel?si=-E0j7Hh9ryEFMljD"
              val supportUrl = "https://github.com/rizal070901-dot/DJALIMEN-MANAGER"

              if (showDialog) {
                  ModalBottomSheet(
                      sheetState = rememberModalBottomSheetState(skipPartiallyExpanded = true),
                      containerColor = Color(0xFF080F1D),
                      onDismissRequest = onDismissRequest
                  ) {
                      Column(
                          modifier = Modifier.fillMaxWidth().padding(horizontal = 24.dp).padding(bottom = 28.dp),
                          horizontalAlignment = Alignment.CenterHorizontally,
                          verticalArrangement = Arrangement.spacedBy(14.dp)
                      ) {
                          Surface(
                              shape = CircleShape,
                              color = Color(0xFF14294B),
                              border = BorderStroke(1.dp, Color(0xFF4D8DFF).copy(alpha = 0.55f)),
                              modifier = Modifier.size(104.dp)
                          ) {
                              Box(contentAlignment = Alignment.Center) {
                                  Text("DJ", color = Color(0xFF8FC4FF), fontSize = 38.sp, fontWeight = FontWeight.Black)
                              }
                          }

                          Text(
                              text = "DJALIMEN MANAGER",
                              fontSize = 23.sp,
                              fontWeight = FontWeight.ExtraBold,
                              color = Color(0xFFF4F7FF),
                              textAlign = TextAlign.Center
                          )
                          Text(
                              text = "ANDROID MODULE CONTROL CENTER",
                              fontSize = 11.sp,
                              fontWeight = FontWeight.Bold,
                              color = Color(0xFF71A9FF),
                              textAlign = TextAlign.Center
                          )

                          Surface(
                              color = Color(0xFF111E36),
                              shape = AxCardShape,
                              border = BorderStroke(1.dp, Color(0xFF29436A)),
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Column(
                                  modifier = Modifier.padding(16.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally,
                                  verticalArrangement = Arrangement.spacedBy(6.dp)
                              ) {
                                  Text("DJALIMEN CHANNEL", fontSize = 17.sp, fontWeight = FontWeight.Bold, color = Color.White)
                                  Text("Pengembang • Pemelihara", fontSize = 13.sp, color = Color(0xFF8FC4FF))
                                  Text(
                                      "Built for performance. Powered by the community.",
                                      fontSize = 13.sp,
                                      color = Color(0xFFBAC9DF),
                                      textAlign = TextAlign.Center
                                  )
                              }
                          }

                          Text(
                          Surface(
                              color = Color(0xFF14294B),
                              shape = RoundedCornerShape(50),
                              border = BorderStroke(1.dp, Color(0xFF4D8DFF).copy(alpha = 0.35f))
                          ) {
                              Text(
                                  "DJM BY DJALIMEN",
                                  modifier = Modifier.padding(horizontal = 18.dp, vertical = 9.dp),
                                  fontSize = 12.sp,
                                  fontWeight = FontWeight.ExtraBold,
                                  letterSpacing = 1.2.sp,
                                  color = Color(0xFF8FC4FF),
                                  textAlign = TextAlign.Center
                              )
                          }

                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              FilledTonalButton(
                                  onClick = { uriHandler.openUri(githubUrl) },
                                  modifier = Modifier.weight(1f).height(48.dp)
                              ) {
                                  Icon(painter = painterResource(id = R.drawable.ic_github), contentDescription = "GitHub", modifier = Modifier.size(19.dp))
                                  Spacer(Modifier.width(7.dp))
                                  Text("GitHub")
                              }
                              FilledTonalButton(
                                  onClick = { uriHandler.openUri(youtubeUrl) },
                                  modifier = Modifier.weight(1f).height(48.dp)
                              ) {
                                  Icon(painter = painterResource(id = R.drawable.ic_youtube), contentDescription = "YouTube", modifier = Modifier.size(19.dp))
                                  Spacer(Modifier.width(7.dp))
                                  Text("YouTube")
                              }
                          }

                          FilledTonalButton(
                              onClick = { uriHandler.openUri(supportUrl) },
                              modifier = Modifier.fillMaxWidth().height(50.dp)
                          ) {
                              Icon(Icons.Filled.Coffee, contentDescription = null, modifier = Modifier.size(19.dp))
                              Spacer(Modifier.width(9.dp))
                              Text("DUKUNG DJALIMEN")
                          }
                      }
                  }
              }
          }
          """
          s = s[:start] + about_ui + s[end:]
          settings_ui.write_text(s, encoding="utf-8")
          print("Applied complete DJALIMEN Midnight Blue theme and redesigned About sheet.")

          
          # Replace AxManager launcher artwork with a DJALIMEN blue-metallic monogram.
          # Vector assets are generated at build time so all densities use the same crisp icon.
          icon_dir = res / "drawable"
          icon_dir.mkdir(parents=True, exist_ok=True)
          foreground = """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFFFF" android:pathData="M25,23 L58,23 C77,23 89,36 89,54 C89,72 77,85 58,85 L25,85 Z M39,36 L39,72 L57,72 C69,72 76,65 76,54 C76,43 69,36 57,36 Z" android:fillType="evenOdd"/>
              <path android:fillColor="#FF79B8FF" android:pathData="M50,43 L62,43 L62,51 L70,51 L70,59 L62,59 L62,68 L50,68 Z"/>
              <path android:fillColor="#FF5577FF" android:pathData="M18,18 L23,18 L23,90 L18,90 Z"/>
              <path android:fillColor="#FFB9D9FF" android:pathData="M27,18 L83,18 L83,22 L27,22 Z"/>
          </vector>
          """
          background = """<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <corners android:radius="24dp"/>
              <gradient android:angle="135" android:startColor="#FF101B35" android:centerColor="#FF173B78" android:endColor="#FF07101F"/>
          </shape>
          """
          (icon_dir / "ic_launcher_foreground.xml").write_text(foreground, encoding="utf-8")
          (icon_dir / "ic_launcher_background.xml").write_text(background, encoding="utf-8")
          adaptive = res / "mipmap-anydpi-v26" / "ic_launcher.xml"
          if adaptive.exists():
              adaptive.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
              <monochrome android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          """, encoding="utf-8")
          # Provide a vector fallback for pre-adaptive-icon launchers (Android 21+).
          legacy_icon = res / "mipmap-anydpi" / "ic_launcher.xml"
          legacy_icon.parent.mkdir(parents=True, exist_ok=True)
          legacy_icon.write_text(foreground, encoding="utf-8")
          print("Applied DJALIMEN vector launcher icon")


          # Keep the original Apache license and upstream NOTICE intact; add distribution attribution.
          notice = Path("NOTICE")
          if notice.exists():
              s = notice.read_text(encoding="utf-8")
              header = "DJALIMEN MANAGER\nCommunity-maintained branded distribution.\nThe underlying AxManager code and third-party components retain their original copyrights and licenses.\n\n"
              if not s.startswith("DJALIMEN MANAGER\\n"):
                  notice.write_text(header + s, encoding="utf-8")

          print("Applied DJALIMEN About, Support, accent, and attribution updates.")
          PY

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :manager:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJALIMEN-MANAGER-debug
          path: upstream/manager/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14