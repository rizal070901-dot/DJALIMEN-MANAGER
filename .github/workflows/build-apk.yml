          # nested Binder listeners, companion objects and Java callers require real JVM classes.
          import os
          package_moves = {
              "frb.axeron.api": "com.djalimen.api",
              "frb.axeron.server": "com.djalimen.server",
          }
          source_ext = (".kt", ".java", ".aidl", ".xml", ".cpp", ".h", ".hpp", ".pro", ".kts", ".gradle")
          migrated = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in {".git", ".gradle", "build", ".idea", ".kotlin"}]
              for filename in files:
                  path = Path(root) / filename
                  if not filename.endswith(source_ext):
                      continue
                  try:
                      content = path.read_text(encoding="utf-8")
                  except (UnicodeDecodeError, OSError):
                      continue
                  updated = content
                  for old, new in package_moves.items():
                      updated = updated.replace(old, new)
                  if updated != content:
                      path.write_text(updated, encoding="utf-8")
                      migrated.append(str(path))

          # AIDL requires the physical directory to match the declared package.
          # Move package directories after rewriting the package declarations.
          aidl_root = Path("api/aidl/src/main/aidl")
          for old, new in package_moves.items():
              old_dir = aidl_root / Path(*old.split("."))
              new_dir = aidl_root / Path(*new.split("."))
              if old_dir.exists():
                  new_dir.parent.mkdir(parents=True, exist_ok=True)
                  if new_dir.exists():
                      raise SystemExit("AIDL target package directory already exists: " + str(new_dir))
                  old_dir.rename(new_dir)

          # Gradle namespaces must match the newly migrated source packages.
          server_gradle = Path("server/build.gradle.kts")
          server_text = server_gradle.read_text(encoding="utf-8")
          if 'namespace = "com.djalimen.server"' not in server_text:
              server_text = server_text.replace('namespace = "frb.axeron.server"', 'namespace = "com.djalimen.server"', 1)
          if 'namespace = "com.djalimen.server"' not in server_text:
              raise SystemExit("Could not set DJALIMEN server namespace")
          server_gradle.write_text(server_text, encoding="utf-8")

          api_gradle = Path("api/api/build.gradle.kts")
          api_text = api_gradle.read_text(encoding="utf-8")
          if 'namespace = "com.djalimen.api"' not in api_text:
              api_text = api_text.replace('namespace = "frb.axeron.api"', 'namespace = "com.djalimen.api"', 1)
          if 'namespace = "com.djalimen.api"' not in api_text:
              raise SystemExit("Could not set DJALIMEN API namespace")
          api_gradle.write_text(api_text, encoding="utf-8")

          # app_process now launches the actual renamed service class, not a wrapper.
          starter = Path("server/src/main/cpp/starter.cpp")
          starter_text = starter.read_text(encoding="utf-8")
          starter_text = starter_text.replace(
              '#define SERVER_CLASS_PATH "frb.axeron.server.AxeronService"',
              '#define SERVER_CLASS_PATH "com.djalimen.server.AxeronService"'
          )
          if '#define SERVER_CLASS_PATH "com.djalimen.server.AxeronService"' not in starter_text:
              raise SystemExit("DJALIMEN native server entry point was not applied")
          starter.write_text(starter_text, encoding="utf-8")

          keep = Path("server/consumer-rules.pro")
          keep_text = keep.read_text(encoding="utf-8")
          keep_text += "\n# Preserve the renamed DJALIMEN app_process service entry point.\n-keep class com.djalimen.server.AxeronService { *; }\n"
          keep.write_text(keep_text, encoding="utf-8")

          # Verify no old API/server package references remain in source/configuration.
          stale = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in {".git", ".gradle", "build", ".idea", ".kotlin"}]
              for filename in files:
                  path = Path(root) / filename
                  if not filename.endswith(source_ext):
                      continue
                  try:
                      content = path.read_text(encoding="utf-8")
                  except (UnicodeDecodeError, OSError):
                      continue
                  if "frb.axeron.api" in content or "frb.axeron.server" in content:
                      stale.append(str(path))
          if stale:
              raise SystemExit("Old API/server package references remain: " + ", ".join(stale[:20]))
          print("Migrated actual API and service packages in " + str(len(migrated)) + " source/config files.")
          print("DJALIMEN service entry point: com.djalimen.server.AxeronService")
          print("DJALIMEN API namespace: com.djalimen.api")
          print("Applied DJALIMEN About, Support, accent, and attribution updates.")
          PY

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :manager:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJALIMEN-MANAGER-debug
          path: upstream/manager/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14