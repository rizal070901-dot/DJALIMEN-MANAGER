name: Build DJALIMEN Manager APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/embedded-termux]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DJALIMEN MANAGER
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install required Android SDK packages
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Configure CI debug signing
        working-directory: upstream
        run: |
          # The upstream signing keystore is private; use the standard debug keystore in CI.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("manager/build.gradle.kts")
          s = p.read_text()
          old = '        signingConfig = signingConfigs.getByName("frb-project")'
          if old not in s:
              raise SystemExit("Expected upstream debug signing config was not found")
          p.write_text(s.replace(old, '        // CI: use standard Android debug signing config', 1))
          PY

      - name: Apply DJALIMEN app branding
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Rebrand user-facing native libaxeron.so diagnostics at source level.
          # Keep protocol identifiers (AXERON env vars, axeron_server, JNI/class paths,
          # executable name and library path) unchanged because scripts/services depend on them.
          native_starter = Path("server/src/main/cpp/starter.cpp")
          native_source = native_starter.read_text(encoding="utf-8")
          native_replacements = {
              'printf("info: axeron_server pid is %d\\n", pid);': 'printf("info: DJALIMEN native service pid is %d\\n", pid);',
              'printf("info: axeron_starter exit with 0\\n");': 'printf("info: DJALIMEN native starter exit with 0\\n");',
              'fatal: run AxManager from non root nor adb user (uid=%d).\\n': 'fatal: run DJALIMEN MANAGER from non root nor adb user (uid=%d).\\n',
              'fatal: can\'t kill %d, please try to stop existing AxManager from app first.\\n': 'fatal: can\'t kill %d, please stop the existing DJALIMEN MANAGER service from the app first.\\n',
          }
          for old, new in native_replacements.items():
              if old not in native_source:
                  raise SystemExit("Native branding target missing: " + old)
              native_source = native_source.replace(old, new, 1)
          native_starter.write_text(native_source, encoding="utf-8")
          print("Applied safe DJALIMEN branding to native starter diagnostics; internal ABI/protocol names preserved.")

          # Change only user-facing string resources. Never rename style/theme/resource identifiers.
          res = Path("manager/src/main/res")
          changed = []
          for p in res.glob("values*/strings.xml"):
              s = p.read_text(encoding="utf-8")
              updated = s.replace("AxManager", "DJALIMEN MANAGER")
              # Consistent DJALIMEN naming for help/support labels in English and Indonesian.
              if p.name == "strings.xml":
                  updated = updated.replace('<string name="support_me">Support Me</string>', '<string name="support_me">Support DJALIMEN</string>')
                  updated = updated.replace('<string name="support_me">Dukung Saya</string>', '<string name="support_me">Dukung DJALIMEN</string>')
                  updated = updated.replace('<string name="learn_more">Learn DJALIMEN MANAGER</string>', '<string name="learn_more">Learn DJALIMEN MANAGER</string>')
                  updated = updated.replace('<string name="learn_more">Pelajari DJALIMEN MANAGER</string>', '<string name="learn_more">Pelajari DJALIMEN MANAGER</string>')
              if updated != s:
                  p.write_text(updated, encoding="utf-8")
                  changed.append(str(p))

          # Restore/guarantee Kotlin-facing resource IDs after branding.
          # These IDs are internal API symbols referenced by R.string.*; their visible
          # values are DJALIMEN-branded. Add only when absent to avoid duplicate resources.
          resource_aliases = {
              "axeron_environment": "DJALIMEN Environment",
              "plugin_axeron_support": "DJALIMEN Support",
              "axeron_permission": "DJALIMEN Permission",
              "axeron_permission_desc": "Permission interception provided by DJALIMEN",
              "axeron_permission_shizuku_missing": "Install Shizuku if an older app requires it; Shizuku does not need to be started.",
          }
          for xml_file in res.glob("values*/strings.xml"):
              xml_text = xml_file.read_text(encoding="utf-8")
              for resource_name, visible_value in resource_aliases.items():
                  key_pattern = r'<string\s+name="' + re.escape(resource_name) + r'"(?:\s+[^>]*)?>'
                  if not re.search(key_pattern, xml_text):
                      if xml_file.parent.name == "values-in":
                          localized = {
                              "axeron_environment": "Lingkungan DJALIMEN",
                              "plugin_axeron_support": "Dukungan DJALIMEN",
                              "axeron_permission": "Izin DJALIMEN",
                              "axeron_permission_desc": "Intersepsi izin yang disediakan oleh DJALIMEN",
                              "axeron_permission_shizuku_missing": "Pasang Shizuku jika aplikasi lama memerlukannya; Shizuku tidak perlu dijalankan.",
                          }
                          visible_value = localized[resource_name]
                      xml_text = xml_text.replace("</resources>", f'    <string name="{resource_name}">{visible_value}</string>\n</resources>')
              xml_file.write_text(xml_text, encoding="utf-8")
              for resource_name in resource_aliases:
                  if not re.search(r'<string\s+name="' + re.escape(resource_name) + r'"(?:\s+[^>]*)?>', xml_text):
                      raise SystemExit("Required Kotlin resource ID missing after branding: " + resource_name + " in " + str(xml_file))
          print("Verified Kotlin resource IDs across all localized string files:", *resource_aliases)

          strings = res / "values" / "strings.xml"
          s = strings.read_text(encoding="utf-8")
          if '<string name="app_name">DJALIMEN MANAGER</string>' not in s:
              raise SystemExit("Could not verify launcher app_name")

          settings = Path("settings.gradle.kts")
          s = settings.read_text(encoding="utf-8")
          s = re.sub(r'rootProject\.name\s*=\s*"[^"]+"', 'rootProject.name = "DJALIMEN MANAGER"', s, count=1)
          settings.write_text(s, encoding="utf-8")

          gradle = Path("manager/build.gradle.kts")
          s = gradle.read_text(encoding="utf-8")
          s = s.replace('"AxManager_v', '"DJALIMEN-MANAGER_v')
          gradle.write_text(s, encoding="utf-8")

          print("Updated string resources:", *changed, sep="\\n - ")
          print("Verified launcher label: DJALIMEN MANAGER")

          # Replace Axeron branding only inside XML text nodes.
          # Resource names such as axeron_environment and plugin_axeron_support are API
          # identifiers consumed by R.string and MUST remain unchanged.
          for p in res.glob("values*/strings.xml"):
              s = p.read_text(encoding="utf-8")
              updated = re.sub(
                  r">([^<>]*)<",
                  lambda m: ">" + m.group(1).replace("Axeron", "DJALIMEN").replace("AXERON", "DJALIMEN").replace("axeron", "DJALIMEN") + "<",
                  s
              )
              if updated != s:
                  p.write_text(updated, encoding="utf-8")
                  print("Rebranded visible Axeron string values without changing resource keys:", p)

          # Rebrand activation-sheet/log messages safely. Do NOT rename Kotlin symbols,
          # Binder/JNI classes, protocol keys, package paths or persistent storage identifiers.
          activation_patches = {
              "manager/src/main/java/frb/axeron/manager/adb/ActivationLog.kt": {
                  'info("AxManager ${BuildConfig.VERSION_NAME} (${BuildConfig.VERSION_CODE})")':
                  'info("DJALIMEN MANAGER ${BuildConfig.VERSION_NAME} (${BuildConfig.VERSION_CODE})")',
              },
              "manager/src/main/java/frb/axeron/manager/ui/viewmodel/ActivateViewModel.kt": {
                  'ActivationLog.warn("Wi-Fi is off — turn it on in the panel, the activation continues once it is connected")':
                  'ActivationLog.warn("Wi-Fi nonaktif — aktifkan melalui panel; aktivasi DJALIMEN akan dilanjutkan setelah terhubung")',
                  'Log.e("AxManager", "startForegroundService", e)':
                  'Log.e("DJALIMEN", "startForegroundService", e)',
                  'Log.w("AxManagerBinder", "server refuses the manager, taking it as stopped")':
                  'Log.w("DJALIMEN Binder", "server refuses the manager, taking it as stopped")',
              },
              "manager/src/main/java/frb/axeron/manager/adb/BootWatchdogService.kt": {
                  'ActivationLog.warn("Wi-Fi is off — waiting for it to be turned on")':
                  'ActivationLog.warn("Wi-Fi nonaktif — menunggu Wi-Fi diaktifkan")',
                  'ActivationLog.success("AxManager is active")':
                  'ActivationLog.success("DJALIMEN MANAGER aktif")',
              },
              "manager/src/main/java/frb/axeron/manager/adb/AdbStarter.kt": {
                  'ActivationLog.info("Running the AxManager starter…")':
                  'ActivationLog.info("Menjalankan starter DJALIMEN…")',
              },
              "manager/src/main/java/frb/axeron/manager/ui/screen/Activate.kt": {
                  'ActivationLog.info("Waiting for the AxManager server to connect…")':
                  'ActivationLog.info("Menunggu layanan DJALIMEN terhubung…")',
                  'ActivationLog.success("AxManager server connected")':
                  'ActivationLog.success("Layanan DJALIMEN terhubung")',
                  'ActivationLog.error("No connection from the AxManager server after ${timeoutMs / 1000} s")':
                  'ActivationLog.error("Layanan DJALIMEN belum terhubung setelah ${timeoutMs / 1000} detik")',
              },
          }
          for relative_path, replacements in activation_patches.items():
              target = Path(relative_path)
              source = target.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  if old not in source:
                      raise SystemExit("Activation branding anchor missing in " + relative_path + ": " + old)
                  source = source.replace(old, new, 1)
              target.write_text(source, encoding="utf-8")
              print("Applied safe DJALIMEN activation log branding:", relative_path)

          # Use the DJALIMEN mark in the permission bottom sheet instead of the legacy logo.
          permission_ui = Path("manager/src/main/java/frb/axeron/manager/ui/RequestPermissionActivity.kt")
          permission_text = permission_ui.read_text(encoding="utf-8")
          old_permission_icon = "R.drawable.ic_axeron"
          if old_permission_icon not in permission_text:
              raise SystemExit("Permission dialog legacy icon anchor missing")
          permission_text = permission_text.replace(old_permission_icon, "R.drawable.ic_djalimen_mark", 1)
          permission_ui.write_text(permission_text, encoding="utf-8")
          print("Rebranded permission dialog title, descriptions and icon for DJALIMEN.")
          # Rebrand the About / Support surfaces while preserving upstream attribution and behavior.
          settings_ui = Path("manager/src/main/java/frb/axeron/manager/ui/screen/Settings.kt")
          s = settings_ui.read_text(encoding="utf-8")
          replacements = {
              'val githubUrl = "https://github.com/fahrez182"': 'val githubUrl = "https://github.com/rizal070901-dot/DJALIMEN-MANAGER"',
              'val sociabuzzUrl = "https://sociabuzz.com/fahrezone/tribe"': 'val sociabuzzUrl = "https://github.com/rizal070901-dot/DJALIMEN-MANAGER"',
              'text = "fahrez182 (FahrezONE)"': 'text = "DJALIMEN CHANNEL"',
              'text = "“Everything is an Idea”"': 'text = "“Built for performance. Powered by the community.”"',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit("Settings About patch target missing: " + old)
              s = s.replace(old, new, 1)
          credit = '                Text(\n                    text = stringResource(R.string.developer_and_maintainer),'
          if credit not in s:
              raise SystemExit("About attribution insertion point missing")
          s = s.replace(credit, '                Text(\n                    text = "Open-source foundation: AxManager by FahrezRB",\n                    fontSize = 12.sp,\n                    color = MaterialTheme.colorScheme.onSurfaceVariant\n                )\n\n' + credit, 1)
          # Keep the original contributor portrait and show explicit upstream credit below the DJALIMEN title.

          # Rebrand the existing support label only. Keep the upstream button layout and click behavior intact.
          old_support = 'Text(stringResource(R.string.support_or_donate))'
          if old_support not in s:
              raise SystemExit("Upstream support button expression not found")
          s = s.replace(old_support, 'Text("Dukung DJALIMEN di GitHub")', 1)
          settings_ui.write_text(s, encoding="utf-8")
          # Generate a dedicated YouTube vector icon for the About action.
          youtube_icon = Path("manager/src/main/res/drawable/ic_youtube.xml")
          youtube_icon.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M23.5,6.2c-0.3,-1.1 -1.2,-2 -2.3,-2.3C19.2,3.4 12,3.4 12,3.4s-7.2,0 -9.2,0.5C1.7,4.2 0.8,5.1 0.5,6.2 0,8.2 0,12 0,12s0,3.8 0.5,5.8c0.3,1.1 1.2,2 2.3,2.3 2,0.5 9.2,0.5 9.2,0.5s7.2,0 9.2,-0.5c1.1,-0.3 2,-1.2 2.3,-2.3C24,15.8 24,12 24,12s0,-3.8 -0.5,-5.8z"/>
              <path android:fillColor="#FF080F1D" android:pathData="M9.6,15.8L9.6,8.2 16,12z"/>
          </vector>
          """, encoding="utf-8")


          home_ui = Path("manager/src/main/java/frb/axeron/manager/ui/screen/Home.kt")
          s = home_ui.read_text(encoding="utf-8")
          # Replace the technical version label below the app title with a continuous welcome marquee.
          # This is presentation-only; version metadata and application behavior remain unchanged.
          marquee_import = "import androidx.compose.foundation.basicMarquee"
          if marquee_import not in s:
              s = s.replace("import androidx.compose.foundation.background", "import androidx.compose.foundation.background\n" + marquee_import, 1)
          # Match the version Text by its stable BuildConfig expression; upstream indentation may vary.
          version_pattern = r'Text\(\s*text = "v\$\{BuildConfig\.VERSION_NAME\} \(\$\{BuildConfig\.VERSION_CODE\}\)",.*?\n\s*\)'
          new_welcome_label = """Text(
                                text = "SELAMAT DATANG DI APLIKASI (DJM) NIKMATI FITURNYA DAN GUNAKAN SECARA MAKSIMAL",
                                modifier = Modifier.fillMaxWidth().basicMarquee(iterations = Int.MAX_VALUE),
                                style = MaterialTheme.typography.labelSmall,
                                color = Color(0xFF65F0C1),
                                fontSize = 10.sp,
                                fontWeight = FontWeight.Medium,
                                maxLines = 1,
                            )"""
          s, replacements = re.subn(version_pattern, new_welcome_label, s, count=1, flags=re.DOTALL)
          if replacements != 1:
              raise SystemExit("Home version label target not found; refusing to alter unrelated UI.")
          s = s.replace('https://github.com/fahrez182/AxManager/issues', 'https://github.com/rizal070901-dot/DJALIMEN-MANAGER/issues')
          s = s.replace('https://github.com/fahrez182/AxManager', 'https://github.com/rizal070901-dot/DJALIMEN-MANAGER')
          s = s.replace('https://fahrez182.github.io/AxManager', 'https://github.com/rizal070901-dot/DJALIMEN-MANAGER#readme')
          # Give Home a distinct DJALIMEN dashboard identity without touching feature logic.
          home_anchor = """            // Status and the plugin/privilege counts read as one card: square inner edges,"""
          home_hero = """            // DJALIMEN cyber command dashboard — intentionally distinct from the upstream layout.
            Surface(
                color = Color(0xFF080F1D),
                shape = AxCardShape,
                modifier = Modifier.fillMaxWidth().border(1.dp, Color(0xFF245B55), AxCardShape)
            ) {
                Column(
                    modifier = Modifier
                        .clip(AxCardShape)
                        .background(Brush.verticalGradient(listOf(Color(0xFF102B2A), Color(0xFF0A1920), Color(0xFF080F1D))))
                        .padding(18.dp),
                    verticalArrangement = Arrangement.spacedBy(13.dp)
                ) {
                    Row(verticalAlignment = Alignment.CenterVertically) {
                        Column(modifier = Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(3.dp)) {
                            Text("DJALIMEN // CORE", color = Color(0xFF65F0C1), fontFamily = FontFamily.Monospace, fontSize = 12.sp, fontWeight = FontWeight.Black, letterSpacing = 1.5.sp)
                            Text("ANDROID CONTROL INTERFACE", color = Color(0xFF8BB8AE), fontFamily = FontFamily.Monospace, fontSize = 9.sp, letterSpacing = 1.sp)
                        }
                        Surface(
                            color = if (isRunning) Color(0xFF123D35) else Color(0xFF332A19),
                            shape = CircleShape
                        ) {
                            Text(
                                if (isRunning) "● ONLINE" else "● STANDBY",
                                modifier = Modifier.padding(horizontal = 11.dp, vertical = 7.dp),
                                color = if (isRunning) Color(0xFF6FFFC6) else Color(0xFFFFD27A),
                                fontFamily = FontFamily.Monospace,
                                fontSize = 9.sp,
                                fontWeight = FontWeight.Bold
                            )
                        }
                    }
                    HorizontalDivider(color = Color(0xFF245B55).copy(alpha = 0.8f))
                    Text("root@djalimen:~$ system_control", color = Color(0xFF65F0C1), fontFamily = FontFamily.Monospace, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                    Text("PERANGKAT DALAM KENDALI.", color = Color(0xFFE7FFF7), fontSize = 22.sp, lineHeight = 27.sp, fontWeight = FontWeight.ExtraBold)
                    Text("Satu pusat kendali untuk modul, akses sistem, dan performa Android.", color = Color(0xFFA5C9BF), fontSize = 12.sp, lineHeight = 18.sp)
                    Row(horizontalArrangement = Arrangement.spacedBy(7.dp)) {
                        listOf("MODULE_ENGINE", "ROOT_ACCESS", "DEVICE_MONITOR").forEach { item ->
                            Surface(color = Color(0xFF102E2B), shape = CircleShape) {
                                Text(item, modifier = Modifier.padding(horizontal = 8.dp, vertical = 6.dp), color = Color(0xFF79DDBD), fontFamily = FontFamily.Monospace, fontSize = 8.sp, fontWeight = FontWeight.Bold)
                            }
                        }
                    }
                    Text("BUILD // DJM-${BuildConfig.VERSION_NAME}", color = Color(0xFF638C83), fontFamily = FontFamily.Monospace, fontSize = 9.sp)
                }
            }

            // Status and the plugin/privilege counts read as one card: square inner edges,""";
          if home_anchor not in s:
              raise SystemExit("Home dashboard insertion anchor missing")
          s = s.replace(home_anchor, home_hero, 1)
          # Replace report-issue controls with a direct DJALIMEN YouTube link.
          s = s.replace('val telegramUrl = "https://t.me/axeron_manager"', 'val youtubeUrl = "https://youtube.com/@djalimenchannel?si=-E0j7Hh9ryEFMljD"')
          s = s.replace('title = stringResource(R.string.report_issue),', 'title = "YouTube DJALIMEN",')
          s = s.replace('message = "\${stringResource(R.string.report_issue_msg)} \${stringResource(R.string.report_issue_msg2)}",', 'message = "Kunjungi kanal YouTube resmi DJALIMEN.",')
          # Locate the report actions by their stable first callback, then replace the
          # complete trailing-actions lambda. This avoids brittle whitespace/full-block matching.
          action_start = s.find('            IconButton(onClick = { uriHandler.openUri(githubIssueUrl) })')
          if action_start < 0:
              raise SystemExit("Report issue action anchor not found in Home.kt")
          action_end = s.find("\n        }\n    }\n}", action_start)
          if action_end < 0:
              raise SystemExit("Could not locate end of report issue actions")
          new_youtube_action = """            IconButton(onClick = { uriHandler.openUri(youtubeUrl) }) {
                Icon(
                    painter = painterResource(R.drawable.ic_youtube),
                    contentDescription = "Buka YouTube DJALIMEN",
                    tint = MaterialTheme.colorScheme.onSurfaceVariant
                )
            }"""
          s = s[:action_start] + new_youtube_action + s[action_end:]
          # Refine the Home activation/status card using whitespace-tolerant source matching.
          import re
          status_pattern = r'(?s)(val containerColor by animateColorAsState\(\s*targetValue = when \{).*?(\n\s*\},\s*\n\s*animationSpec = tween\(400\),)'
          status_match = re.search(status_pattern, s)
          if not status_match:
              raise SystemExit("Could not locate Home activation status color selector")
          status_block = status_match.group(0)
          status_block = re.sub(r'isNeedExtraStep -> MaterialTheme\.colorScheme\.errorContainer', 'isNeedExtraStep -> Color(0xFF302719)', status_block, count=1)
          status_block = re.sub(r'else -> MaterialTheme\.colorScheme\.errorContainer', 'else -> Color(0xFF101F38)', status_block, count=1)
          status_block = re.sub(r'isRunning -> MaterialTheme\.colorScheme\.primaryContainer', 'isRunning -> Color(0xFF142B49)', status_block, count=1)
          s = s[:status_match.start()] + status_block + s[status_match.end():]
          s = s.replace(
              'text = stringResource(R.string.home_badge_stopped),\n                                    container = colors.error,\n                                    content = colors.onError',
              'text = "PERLU AKTIVASI",\n                                    container = Color(0xFF244B78),\n                                    content = Color(0xFFD7E9FF)',
              1
          )
          # Replace the stopped-state X watermark with the DJALIMEN brand mark.
          # This is presentation-only; activation state and click behavior stay unchanged.
          if 'else -> rememberVectorPainter(Icons.Outlined.Cancel)' not in s:
              raise SystemExit("Activation watermark anchor missing")
          s = s.replace(
              'else -> rememberVectorPainter(Icons.Outlined.Cancel)',
              'else -> painterResource(R.drawable.ic_djalimen_mark)',
              1
          )
          # The running state uses the original Axeron logo as a separate resource.
          # Replace that branch too; otherwise the old logo remains visible while active.
          running_mark = 'isRunning -> painterResource(R.drawable.ic_axeron)'
          if running_mark not in s:
              raise SystemExit("Running-state Axeron watermark target missing")
          s = s.replace(
              running_mark,
              'isRunning -> painterResource(R.drawable.ic_djalimen_mark)',
              1
          )
          home_ui.write_text(s, encoding="utf-8")

          # Brand the plugin manager's visible console output without changing internal process/env names.
          igniter = Path("reignite/src/main/java/frb/axeron/reignite/Igniter.kt")
          igniter_text = igniter.read_text(encoding="utf-8")
          if 'AXERON Plugin Manager ($VERSION)' not in igniter_text:
              raise SystemExit("Plugin manager log branding anchor missing")
          igniter_text = igniter_text.replace(
              'AXERON Plugin Manager ($VERSION)',
              'DJALIMEN Plugin Manager ($VERSION)'
          )
          igniter.write_text(igniter_text, encoding="utf-8")

          # A clean, original DJALIMEN monogram for the activation-card watermark.
          mark = res / "drawable" / "ic_djalimen_mark.xml"
          mark.parent.mkdir(parents=True, exist_ok=True)
          mark.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="180dp" android:height="180dp"
              android:viewportWidth="180" android:viewportHeight="180">
              <path android:fillColor="#FF65F0C1"
                  android:pathData="M90,12 C133,12 168,47 168,90 C168,133 133,168 90,168 C47,168 12,133 12,90 C12,47 47,12 90,12 Z M90,28 C56,28 28,56 28,90 C28,124 56,152 90,152 C124,152 152,124 152,90 C152,56 124,28 90,28 Z"
                  android:fillType="evenOdd"/>
              <path android:fillColor="#FF65F0C1"
                  android:pathData="M65,49 L91,49 C117,49 134,65 134,90 C134,115 117,131 91,131 L65,131 Z M83,66 L83,114 L91,114 C106,114 116,105 116,90 C116,75 106,66 91,66 Z"
                  android:fillType="evenOdd"/>
              <path android:fillColor="#FF0A1920"
                  android:pathData="M92,75 L105,75 L105,86 L116,86 L116,99 L105,99 L105,110 L92,110 Z"/>
          </vector>
          """, encoding="utf-8")
          print("Rebranded plugin console output and activation watermark to DJALIMEN.")


          # Present legacy environment identifiers with DJALIMEN labels only.
          # The real environment keys and values remain untouched for service compatibility.
          editor_ui = Path("manager/src/main/java/frb/axeron/manager/ui/screen/SettingsEditor.kt")
          editor_text = editor_ui.read_text(encoding="utf-8")
          old_display = "highlightMatches(entry.keyDisplay, query, matchStyle)"
          new_display = 'highlightMatches(entry.keyDisplay.replace(Regex("(?i)axeron"), "DJALIMEN"), query, matchStyle)'
          if old_display not in editor_text:
              raise SystemExit("Settings editor display-key anchor missing")
          editor_text = editor_text.replace(old_display, new_display)
          # Environment values such as /data/.../axeron/bin are presentation-only aliases.
          # Keep the real filesystem paths and service protocol untouched.
          env_value_anchor = "            text = text,"
