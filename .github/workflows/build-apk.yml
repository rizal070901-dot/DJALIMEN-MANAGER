name: Build DJALIMEN Manager APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DJALIMEN MANAGER
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install required Android SDK packages
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Configure CI debug signing
        working-directory: upstream
        run: |
          # The upstream signing keystore is private; use the standard debug keystore in CI.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("manager/build.gradle.kts")
          s = p.read_text()
          old = '        signingConfig = signingConfigs.getByName("frb-project")'
          if old not in s:
              raise SystemExit("Expected upstream debug signing config was not found")
          p.write_text(s.replace(old, '        // CI: use standard Android debug signing config', 1))
          PY

      - name: Apply DJALIMEN app branding
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path

          strings = Path("manager/src/main/res/values/strings.xml")
          text = strings.read_text()
          old = '<string name="app_name">AxManager</string>'
          if old not in text:
              raise SystemExit("Expected app_name resource was not found; refusing an unsafe partial rebrand")
          strings.write_text(text.replace(old, '<string name="app_name">DJALIMEN MANAGER</string>', 1))

          settings = Path("settings.gradle.kts")
          text = settings.read_text()
          if 'rootProject.name = "AxManager"' not in text:
              raise SystemExit("Expected Gradle project name was not found")
          settings.write_text(text.replace('rootProject.name = "AxManager"', 'rootProject.name = "DJALIMEN MANAGER"', 1))

          gradle = Path("manager/build.gradle.kts")
          text = gradle.read_text()
          if '"AxManager_v' not in text:
              raise SystemExit("Expected APK output naming pattern was not found")
          gradle.write_text(text.replace('"AxManager_v', '"DJALIMEN-MANAGER_v', 1))
          PY

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :manager:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJALIMEN-MANAGER-debug
          path: upstream/manager/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14